name: Deploy to GitHub Pages
# Live site: main at the root.
# Dev preview: feature/rsvp at /preview/ (rebuilt by preview-trigger.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # the github-pages environment only accepts deploys from main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - name: Add dev preview (feature/rsvp) at /preview/
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: feature/rsvp
          path: site/preview
      - name: Point the preview's link-preview URLs at /preview/
        run: |
          [ -f site/preview/index.html ] || exit 0
          sed -i 's#https://100sun.github.io/precious-wedding/#https://100sun.github.io/precious-wedding/preview/#g' site/preview/index.html
      - name: Build Korean share pages (ko.html) where the generator exists
        run: |
          [ -f site/tools/og/make-ko.mjs ] && (cd site && node tools/og/make-ko.mjs)
          [ -f site/preview/tools/og/make-ko.mjs ] && (cd site/preview && node tools/og/make-ko.mjs https://100sun.github.io/precious-wedding/preview/)
          true
      - run: rm -rf site/.git site/preview/.git site/preview/.github
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
